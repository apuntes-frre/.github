name: Check Scripts

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'templates/**'
      - 'data/*.toml'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'templates/**'
      - 'data/*.toml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: 'tests/test_scripts.py'
      - name: Run regressions without GitHub access
        run: uv run tests/test_scripts.py
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
