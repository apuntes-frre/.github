name: Check Scripts

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'templates/**'
      - 'data/*.toml'
      - 'transcription/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'templates/**'
      - 'data/*.toml'
      - 'transcription/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: 'tests/test_scripts.py'
      - name: Run regressions without GitHub access
        run: uv run tests/test_scripts.py
      - uses: jdx/mise-action@v3
        with:
          working_directory: templates/transcription
      - name: Check transcription regressions and math rendering
        run: |
          mise -C templates/transcription exec -- uv run ../../tests/test_transcription.py
          mise -C templates/transcription exec -- uv run ../../scripts/check_transcription.py --self-test
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml templates/transcription/workflow.yml
