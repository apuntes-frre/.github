name: Link Check

on:
  schedule:
    - cron: '0 4 * * 1' # Lunes 04:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/link-check.yml'

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-concurrency 8 --accept 200,206,429 './**/*.md'
          fail: false

      - name: Update recurring issue on scheduled failure
        if: steps.lychee.outputs.exit_code != '0' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Enlaces rotos en la documentación'
          issue=$(gh issue list --state open --search "$title in:title" --json number,title --jq '.[] | select(.title == "Enlaces rotos en la documentación") | .number' | head -n 1)
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file lychee/out.md
          else
            gh issue create --title "$title" --body-file lychee/out.md
          fi

      - name: Fail when links are broken
        if: steps.lychee.outputs.exit_code != '0'
        run: exit 1
