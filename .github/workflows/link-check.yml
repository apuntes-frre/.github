name: Link Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.md'
      - '.github/workflows/link-check.yml'

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check local documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          # Las URLs externas son fuentes, no dependencias de validación de CI.
          args: --offline --no-progress './**/*.md'
          fail: true
