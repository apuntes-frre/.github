name: Synchronize Subject Instructions

on:
  push:
    branches: [main]
    paths:
      - 'templates/subject_agents.md'
      - 'templates/transcription/**'
      - 'CONTRIBUTING.md'
      - 'scripts/sync_repos.py'
      - 'scripts/common.py'
      - 'scripts/check_transcription.py'
      - 'scripts/transcription_preflight.py'
      - 'data/*.toml'
      - '.github/workflows/subject-agents.yml'
  schedule:
    - cron: '0 5 * * *' # Detecta materias creadas fuera del script, diariamente.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subject-instructions
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ORG_ADMIN_TOKEN: ${{ secrets.PAT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: 'scripts/sync_repos.py'
      - name: Check synchronization credential
        run: uv run scripts/sync_repos.py auth
      - name: Synchronize instructions and validation
        run: uv run scripts/sync_repos.py bootstrap --apply
