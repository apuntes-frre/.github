name: Repository Audit

on:
  schedule:
    - cron: '0 6 1 * *' # Día 1 de cada mes, 06:00 UTC.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: 'scripts/sync_repos.py'

      - name: Validate manifest
        run: uv run scripts/sync_repos.py manifest validate isi

      - name: Compare published plan 2008 with manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run scripts/sync_repos.py manifest diff isi --plan 2008
